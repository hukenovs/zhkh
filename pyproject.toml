[project]
name = "zhkh"
version = "0.1.0"
description = "Авто-сбор квитанций ЖКХ из личных кабинетов"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Alexander Kapitanov" }]
dependencies = [
    "playwright>=1.49",
    "pyyaml>=6.0",
    "rich>=13.9",
    "click>=8.1",
    "httpx>=0.27",
    "python-telegram-bot>=21.0",
]

[project.scripts]
zhkh = "zhkh.cli:main"
zhkh-bot = "zhkh.tgbot:main_bot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zhkh"]
# prompts.txt — не-py ресурс, явно включаем в wheel.
artifacts = ["src/zhkh/prompts.txt"]
